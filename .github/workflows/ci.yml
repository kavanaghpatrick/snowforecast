name: CI

# Lints and tests the live product: the V2 dashboard and fetcher.
# The retired V1 ML stack (src/) is excluded here and in ruff.toml;
# its own suites live in test-pipelines.yml, which only fires on V1 paths.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check dashboard_v2/ scripts/fetch_data_v2.py scripts/validate_forecasts_v2.py tests/dashboard_v2 tests/fetcher_v2

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is local dev; 3.13 is what Streamlit Cloud runs the app on.
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest cryptography

      # Two invocations: the suites carry same-named conftest modules and
      # cannot be collected together in one pytest run.
      - name: Dashboard suite
        run: python -m pytest tests/dashboard_v2 -q

      - name: Fetcher suite
        run: python -m pytest tests/fetcher_v2 -q
