name: Refresh Dashboard V2 Data

on:
  schedule:
    # Run 3x daily: 6 AM, 12 PM, 6 PM UTC
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install herbie-data pandas numpy xarray

      - name: Fetch forecast data
        run: python scripts/fetch_data_v2.py
        continue-on-error: true  # Don't fail if some data unavailable

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecasts_v2.json
          git diff --staged --quiet || git commit -m "Update forecast data [skip ci]"
          git push
