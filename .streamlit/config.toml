[server]
headless = true
enableStaticServing = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2C5B8C"
backgroundColor = "#F2F3F0"
secondaryBackgroundColor = "#F2F3F0"
textColor = "#1A2230"
font = "serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
showErrorDetails = false
